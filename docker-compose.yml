services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend/app:/app/app
      - ./backend/llm_core:/app/llm_core
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

