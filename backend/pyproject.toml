[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabioto-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "supabase",
    "playwright==1.50.0",
    "python-dotenv",
    "pydantic-settings",
    "cryptography",
    "apscheduler",
    "google-genai",
    "httpx",
    "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]
eval = [
    "langsmith",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "llm_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
